name: Typecheck

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: wenkokke/setup-agda@v2
        with:
          agda-version: '2.7.0.1'

      - name: Typecheck artifact
        working-directory: artifact
        run: agda everything.agda
